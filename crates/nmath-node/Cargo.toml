[package]
name = "nmath-node"
description = "Node.js binding for the NMath native runtime."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3.15.0", default-features = false, features = ["napi9"] }
napi-derive = "3.6.13"
nmath-core.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[build-dependencies]
napi-build = "2.6.0"
