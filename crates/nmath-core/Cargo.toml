[package]
name = "nmath-core"
description = "Native arrays, lazy expressions, contexts and kernels for NMath."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json = { workspace = true, features = ["arbitrary_precision"] }
tracing.workspace = true
zip = { version = "=9.1.3", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
pollster = "=0.4.0"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["metal"] }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64", target_env = "gnu"))'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["vulkan"] }

[target.'cfg(all(target_os = "windows", target_arch = "x86_64"))'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["dx12"] }

[dev-dependencies]
tempfile = "3"
naga = { version = "=30.0.1", default-features = false, features = ["wgsl-in"] }
